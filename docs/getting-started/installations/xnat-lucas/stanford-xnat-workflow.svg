    <g id="cloud-icon" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M 10 35 C -4 32 -1 13 13 15 C 18 -2 39 -2 45 14 C 63 11 69 35 52 37 H 10"/></g>
