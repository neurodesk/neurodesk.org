<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1180" viewBox="0 0 2100 1180" role="img" aria-labelledby="title desc">
  <title id="title">Lucas Centre XNAT data workflow</title>
  <desc id="desc">Multiple MRI scanners at the Lucas Centre send DICOM to a local Orthanc server. Raw TWIX and physiological files enter the same local server through Samba. All received originals remain in local storage. An additional local anonymization step, confirmed by the user as deployed at the Lucas Centre, prepares cloud copies before AIS Edge stages and uploads them through HTTPS and S3 to cloud SeaweedFS. A cloud ingest worker imports staged files into XNAT through REST. XNAT Container Service runs Docker processing and returns outputs to XNAT. Users launch an interactive Neurodesk JupyterLab environment through JupyterHub, access mounted XNAT project data and a personal workspace, and upload processed files back to XNAT. Researchers also download data and derivatives to computers or HPC.</desc>
